services:
  trawlarr:
    build: .
    container_name: trawlarr
    restart: unless-stopped
    ports:
      # Listens on localhost only. To expose it on your LAN, change this to
      # "8080:8080" knowingly (see the Security section of the README).
      - "127.0.0.1:8080:8080"
    volumes:
      # A named volume keeps the auto-lists across restarts and needs no host
      # permission setup. To keep lists.json somewhere you can read instead,
      # swap this for a bind mount and match the container user:
      #   user: "${PUID:-1000}:${PGID:-1000}"
      #   volumes: [ "./data:/data" ]     # run `mkdir -p data` first
      - trawlarr-data:/data
    # Hardening: the app only ever writes to /data (the volume above).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # --- TMDB ---
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-en-US}
      TMDB_REGION: ${TMDB_REGION:-US}
      # --- Radarr ---
      RADARR_URL: ${RADARR_URL}
      RADARR_API_KEY: ${RADARR_API_KEY}
      # --- Add-to-Radarr defaults (optional) ---
      RADARR_QUALITY_PROFILE_ID: ${RADARR_QUALITY_PROFILE_ID:-}
      RADARR_ROOT_FOLDER: ${RADARR_ROOT_FOLDER:-}
      RADARR_MINIMUM_AVAILABILITY: ${RADARR_MINIMUM_AVAILABILITY:-released}
      RADARR_MONITOR: ${RADARR_MONITOR:-true}
      RADARR_SEARCH_ON_ADD: ${RADARR_SEARCH_ON_ADD:-true}
      # --- Sonarr (series) ---
      SONARR_URL: ${SONARR_URL}
      SONARR_API_KEY: ${SONARR_API_KEY}
      # --- Add-to-Sonarr defaults (optional) ---
      SONARR_QUALITY_PROFILE_ID: ${SONARR_QUALITY_PROFILE_ID:-}
      SONARR_ROOT_FOLDER: ${SONARR_ROOT_FOLDER:-}
      SONARR_MONITOR: ${SONARR_MONITOR:-true}
      SONARR_SEARCH_ON_ADD: ${SONARR_SEARCH_ON_ADD:-true}
      SONARR_SERIES_TYPE: ${SONARR_SERIES_TYPE:-standard}
      SONARR_SEASON_FOLDER: ${SONARR_SEASON_FOLDER:-true}
      # --- Mistral AI (voice assistant, optional) ---
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
      ASSISTANT_LANGUAGE: ${ASSISTANT_LANGUAGE:-}
      # --- Auto-lists ---
      DATA_DIR: ${DATA_DIR:-/data}
      LIST_REFRESH_HOURS: ${LIST_REFRESH_HOURS:-12}
      LIST_MAX_PAGES: ${LIST_MAX_PAGES:-3}

volumes:
  trawlarr-data:
