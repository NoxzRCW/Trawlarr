services:
  media-search:
    build: .
    container_name: radarr-media-search
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # --- TMDB ---
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-fr-FR}
      TMDB_REGION: ${TMDB_REGION:-FR}
      # --- Radarr ---
      RADARR_URL: ${RADARR_URL}
      RADARR_API_KEY: ${RADARR_API_KEY}
      # --- Add-to-Radarr defaults (optional) ---
      RADARR_QUALITY_PROFILE_ID: ${RADARR_QUALITY_PROFILE_ID:-}
      RADARR_ROOT_FOLDER: ${RADARR_ROOT_FOLDER:-}
      RADARR_MINIMUM_AVAILABILITY: ${RADARR_MINIMUM_AVAILABILITY:-released}
      RADARR_MONITOR: ${RADARR_MONITOR:-true}
      RADARR_SEARCH_ON_ADD: ${RADARR_SEARCH_ON_ADD:-true}
      # --- Sonarr (series) ---
      SONARR_URL: ${SONARR_URL}
      SONARR_API_KEY: ${SONARR_API_KEY}
      # --- Add-to-Sonarr defaults (optional) ---
      SONARR_QUALITY_PROFILE_ID: ${SONARR_QUALITY_PROFILE_ID:-}
      SONARR_ROOT_FOLDER: ${SONARR_ROOT_FOLDER:-}
      SONARR_MONITOR: ${SONARR_MONITOR:-true}
      SONARR_SEARCH_ON_ADD: ${SONARR_SEARCH_ON_ADD:-true}
      SONARR_SERIES_TYPE: ${SONARR_SERIES_TYPE:-standard}
      SONARR_SEASON_FOLDER: ${SONARR_SEASON_FOLDER:-true}
      # --- Mistral AI (voice assistant, optional) ---
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
