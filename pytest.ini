[pytest]
# `pythonpath = .` makes `import app.main` work when pytest is run from the
# repository root. Without it pytest only puts tests/ on sys.path and every
# test fails at import.
pythonpath = .
testpaths = tests
# `auto` means async test functions run without an @pytest.mark.asyncio marker.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --strict-markers
